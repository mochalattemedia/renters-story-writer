<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verified members across the country</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0d2d4e;--deep:#081f38;--teal:#3a9e8f;--lime:#8dc63f;--gold:#e0a92e;--ink:#0d2d4e;--mut:#5a6b7d;--line:#e6ebf0;--land:#f2f5f8;--stroke:#dfe6ee}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Open Sans",system-ui,sans-serif;color:var(--ink);background:#fff}
  .wrap{max-width:1120px;margin:0 auto;padding:6px 14px 10px}
  h2{font-family:"Red Hat Display",sans-serif;font-weight:800;font-size:clamp(26px,4vw,40px);letter-spacing:-.02em;text-align:center;color:var(--navy);margin:18px 0 4px}
  .sub{text-align:center;color:var(--mut);font-size:15px;margin:0 0 18px}
  .strip{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 auto 10px;max-width:840px}
  .stat{flex:1 1 128px;min-width:118px;max-width:168px;border:1px solid var(--line);border-radius:14px;padding:13px 10px;text-align:center;background:#fff}
  .stat b{font-family:"Red Hat Display",sans-serif;font-weight:800;font-size:25px;color:var(--navy);display:block;line-height:1}
  .stat span{display:block;margin-top:6px;font-size:12px;color:var(--mut);font-weight:600}
  .stat.accent b{color:var(--teal)}
  .mapbox{position:relative;width:100%;background:linear-gradient(180deg,#fbfdff,#f4f8fb);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  svg{display:block;width:100%;height:auto}
  .state{fill:var(--land);stroke:var(--stroke);stroke-width:.75}
  .renter{fill:var(--teal);fill-opacity:.55}
  .prov-ll{fill:var(--navy)}
  .prov-pm{fill:var(--lime)}
  .prov-rt{fill:var(--gold)}
  .hub{cursor:pointer}
  .hub:hover .renter{fill-opacity:.85}
  .legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:16px 0 0;font-size:13px;color:var(--mut)}
  .legend i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
  .foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:10px}
  .tip{position:absolute;pointer-events:none;background:var(--deep);color:#fff;padding:9px 12px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .12s;transform:translate(-50%,-115%);white-space:nowrap;z-index:5;box-shadow:0 6px 20px rgba(8,31,56,.35)}
  .tip b{font-family:"Red Hat Display",sans-serif}
  .tip .r{display:flex;justify-content:space-between;gap:16px;margin-top:2px;font-size:12px;opacity:.9}
</style>
</head>

      if(s.ll) rows+='<div class="r"><span>Landlords</span><b>'+s.ll+'</b></div>';
      if(s.pm) rows+='<div class="r"><span>Property mgrs</span><b>'+s.pm+'</b></div>';
      if(s.rt) rows+='<div class="r"><span>Realtors</span><b>'+s.rt+'</b></div>';
      tip.innerHTML='<b>'+place+'</b><div class="r"><span>Renters looking</span><b>'+s.ren+'</b></div>'+rows;
      var box=document.getElementById("map").getBoundingClientRect();
      var mb=document.querySelector(".mapbox").getBoundingClientRect();
      tip.style.left=(ev.clientX-mb.left)+"px";
      tip.style.top=(ev.clientY-mb.top)+"px";
      tip.style.opacity=1;
    }).on("mouseleave",function(){tip.style.opacity=0;});
  });

});
</script>

<script>
// Auto-height: report our true content height to the parent page so the iframe can
// size exactly to the content (no white space, no inner scroll), on any device.
(function(){
  function reportHeight(){
    var h = document.documentElement.scrollHeight || document.body.scrollHeight;
    if (window.parent && window.parent!==window){
      window.parent.postMessage({ rdcMapHeight: h }, "*");
    }
  }
  window.addEventListener("load", function(){ reportHeight(); setTimeout(reportHeight, 400); setTimeout(reportHeight, 1200); });
  window.addEventListener("resize", reportHeight);
  // also report after the map draws (d3 async)
  var tries=0; var iv=setInterval(function(){ reportHeight(); if(++tries>6) clearInterval(iv); }, 500);
})();
</script>
