<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renters.com — Listing Status Dashboard</title>
<style>
  :root { --navy:#0d2d4e; --green:#8dc63f; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:#f1f5f9; }
  header { background:var(--navy); color:#fff; padding:16px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:800; letter-spacing:.01em; }
  header .sp { flex:1; }
  header button { background:var(--green); color:var(--navy); border:0; border-radius:8px; padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px 22px 60px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 16px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-width:130px; }
  .stat .n { font-size:24px; font-weight:800; color:var(--navy); }
  .stat .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .controls input[type=text] { padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; min-width:220px; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; }
  .filters button { background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 13px; font-size:13px; cursor:pointer; color:var(--ink); }
  .filters button.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  .scanbox { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .scanbox input { width:110px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .scanbox button { background:var(--navy); color:#fff; border:0; border-radius:8px; padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer; }
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  thead th { background:#f8fafc; text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); padding:11px 12px; border-bottom:1px solid var(--line); }
  tbody td { padding:12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  tbody tr:last-child td { border-bottom:0; }
  .name { font-weight:700; color:var(--navy); }
  .idpill { display:inline-block; font-size:11px; color:var(--muted); background:#f1f5f9; border-radius:6px; padding:1px 6px; margin-left:6px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; text-transform:uppercase; letter-spacing:.03em; }
  .tag.live { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
  .tag.pending { background:#fff7ed; color:#9a3412; border:1px solid #fed7aa; }
  .tag.draft { background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; }
  .tag.unknown { background:#f1f5f9; color:#94a3b8; border:1px solid #e2e8f0; }
  .dates { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.5; }
  .grp { margin:3px 0; font-size:13px; line-height:1.45; }
  .grp b { text-transform:uppercase; font-size:11px; letter-spacing:.03em; color:var(--navy); }
  .complete { color:#065f46; font-weight:700; font-size:13px; }
  .muted { color:var(--muted); }
  .emailinfo { font-size:12px; color:var(--muted); }
  .actions { white-space:nowrap; }
  .actions button { display:block; width:100%; margin-bottom:6px; border:0; border-radius:7px; padding:7px 10px; font-size:12px; font-weight:700; cursor:pointer; }
  /* FIXED WIDTH. The armed label used to swap in the full email address,
     which made the button far wider and moved it out from under the cursor -
     so the second click landed on empty space and nothing was ever sent. The
     tracker bookmarklet had the identical bug. The armed label is now SHORTER
     than the idle one, and the width never changes either way. */
  .btn-email { background:var(--navy); color:#fff; width:132px; min-width:132px; text-align:center; box-sizing:border-box; white-space:nowrap; overflow:hidden; }
  .btn-email.armed { background:#b45309; }
  .actions textarea.note { width:132px; margin-top:6px; font:inherit; font-size:12px; padding:5px 7px; border:1px solid var(--line); border-radius:7px; resize:vertical; box-sizing:border-box; }
  .tonepill { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; margin-top:6px; }
  .tonepill.improve { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
  .tonepill.draft { background:#fff7ed; color:#7c2d12; border:1px solid #fed7aa; }
  .redo { margin-top:5px; font-size:12px; font-weight:700; color:#7f1d1d; background:#fee2e2; border:1px solid #fecaca; border-radius:6px; padding:4px 7px; display:inline-block; }
  .btn-scan { background:#eef2f5; color:var(--navy); border:1px solid var(--line)!important; }
  .empty { text-align:center; color:var(--muted); padding:50px 20px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; box-shadow:0 8px 24px rgba(2,6,23,.35); opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .updated { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Renters.com &middot; Listing Status</h1>
  <span class="sp"></span>
  <span id="updated" class="updated" style="color:#cbd8e6;"></span>
  <button id="refresh">Refresh</button>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search by name or ID…">
    <div class="filters" id="filters">
      <button data-f="needs" class="active">Needs work</button>
      <button data-f="notpub">Not published</button>
      <button data-f="pending">Pending approval</button>
      <button data-f="published">Published</button>
      <button data-f="notemailed">Not emailed</button>
      <button data-f="edited">Edited since notified</button>
      <button data-f="all">All</button>
    </div>
    <div class="scanbox">
      <input id="scanid" type="text" inputmode="numeric" placeholder="Listing ID">
      <button id="scanbtn">Scan</button>
    </div>
  </div>
  <div id="tablewrap"></div>
</div>
<div id="unlock" style="position:fixed;inset:0;background:#0d2d4e;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#fff;border-radius:12px;padding:26px 28px;width:340px;max-width:92vw;box-shadow:0 20px 50px rgba(2,6,23,.5);">
    <div style="font-size:17px;font-weight:800;color:#0d2d4e;margin-bottom:6px;">Renters.com &middot; Listing Status</div>
    <div style="font-size:13px;color:#64748b;margin-bottom:14px;">Enter your access key to continue.</div>
    <input id="unlockkey" type="password" placeholder="Access key" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;margin-bottom:6px;">
    <div id="unlockerr" style="font-size:12px;color:#b91c1c;min-height:16px;margin-bottom:6px;"></div>
    <button id="unlockbtn" style="width:100%;background:#8dc63f;color:#0d2d4e;border:0;border-radius:8px;padding:11px;font-size:15px;font-weight:800;cursor:pointer;">Unlock</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  var FN = "https://renters-story-writer.netlify.app/.netlify/functions/send-listing-draft-email";
  var KEY = sessionStorage.getItem("rdc_key") || "";
  var DATA = {};        // id -> status record
  var FILTER = "needs";
  var SEARCH = "";

  function esc(x) { return String(x == null ? "" : x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function d10(x) { return String(x || "").slice(0, 10); }
  function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2600); }

  // BD status codes -> label + colour. 1 Published, 3 Pending approval, 0 Not published.
  var STATUS = { "1": { label: "Published", cls: "live" }, "3": { label: "Pending approval", cls: "pending" }, "0": { label: "Not published", cls: "draft" } };
  function statusMeta(code) { return STATUS[String(code)] || { label: "Unknown", cls: "unknown" }; }
  function isLive(code) { return String(code) === "1"; }
  function isNotLive(code) { return String(code) === "0" || String(code) === "3"; }
  function fmtDate(raw) {
    if (!raw) return "";
    var s = String(raw);
    var m = s.match(/^(\d{4})(\d{2})(\d{2})/);
    if (m) return m[1] + "-" + m[2] + "-" + m[3];
    return s.slice(0, 10);
  }

  function gaps(s) {
    var au = s.auto || {};
    var photo = au.photo || (au.items && !au.listing && !au.profile ? au.items : []) || [];
    return { photo: photo, listing: au.listing || [], profile: au.profile || [], scanned: !!au.date, group_status: au.group_status, created: au.created, lastEdit: au.lastEdit };
  }
  function totalGaps(s) { var g = gaps(s); return g.photo.length + g.listing.length + g.profile.length + ((s.items && !g.scanned) ? s.items.length : 0); }

  // EDITED SINCE WE TOLD THEM. The landlord has changed the listing after our
  // notice, so it is waiting on a re-review. This is the actual work queue.
  // DATE FORMATS DISAGREE ACROSS THE STORE, and that is the whole difficulty:
  //   auto.lastEdit   "2026-08-28 04:14:58"
  //   auto.created    "20260828011458"
  //   tracker badge   "08/28/2026"   (scraped off BD's page)
  // Parse each to a day rather than comparing strings, or this dashboard and
  // the tracker badge will disagree about the same listing.
  function dayOf(raw) {
    if (!raw) return null;
    var t = String(raw).trim();
    var y, m, d;
    if (t.length >= 8 && t.indexOf("-") === -1 && t.indexOf("/") === -1) {
      y = +t.slice(0, 4); m = +t.slice(4, 6); d = +t.slice(6, 8);
    } else if (t.indexOf("/") !== -1) {
      var a = t.split("/");
      if (a.length < 3) return null;
      m = +a[0]; d = +a[1]; y = +String(a[2]).slice(0, 4);
    } else {
      var b = t.slice(0, 10).split("-");
      if (b.length < 3) return null;
      y = +b[0]; m = +b[1]; d = +b[2];
    }
    if (!y || !m || !d) return null;
    var ms = new Date(y, m - 1, d).getTime();
    return isNaN(ms) ? null : ms;
  }

  function editedSince(s) {
    if (!s || !s.notifyCount) return false;
    var g = gaps(s);
    var edited = dayOf(g.lastEdit);
    var told = dayOf(s.lastNotified || s.date);
    if (edited === null || told === null) return false;
    return edited > told;
  }

  function stats() {
    var ids = Object.keys(DATA), needs = 0, published = 0, pending = 0, notpub = 0, emailed = 0, redo = 0;
    ids.forEach(function (id) {
      var s = DATA[id], g = gaps(s), tg = totalGaps(s), code = String(g.group_status);
      if (tg > 0) needs++;
      if (code === "1") published++; else if (code === "3") pending++; else if (code === "0") notpub++;
      if (s.notifyCount) emailed++;
      if (editedSince(s)) redo++;
    });
    var box = document.getElementById("stats");
    function card(n, l) { return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }
    box.innerHTML = card(ids.length, "Listings tracked") + card(needs, "Need work") + card(redo, "Awaiting re-review") + card(notpub, "Not published") + card(pending, "Pending approval") + card(published, "Published");
  }

  function matches(id, s) {
    var g = gaps(s), tg = totalGaps(s), code = String(g.group_status);
    if (FILTER === "needs" && tg === 0) return false;
    if (FILTER === "notpub" && code !== "0") return false;
    if (FILTER === "pending" && code !== "3") return false;
    if (FILTER === "published" && code !== "1") return false;
    if (FILTER === "notemailed" && (s.notifyCount || tg === 0 || isLive(code))) return false;
    if (FILTER === "edited" && !editedSince(s)) return false;
    if (SEARCH) {
      var hay = (id + " " + (s.listingName || "") + " " + ((s.landlord && s.landlord.email) || "")).toLowerCase();
      if (hay.indexOf(SEARCH) === -1) return false;
    }
    return true;
  }

  function grpHtml(title, arr) { return arr && arr.length ? ('<div class="grp"><b>' + title + ':</b> ' + arr.map(esc).join("; ") + '</div>') : ""; }

  function render() {
    stats();
    var ids = Object.keys(DATA).filter(function (id) { return matches(id, DATA[id]); });
    ids.sort(function (a, b) { return totalGaps(DATA[b]) - totalGaps(DATA[a]); });
    var wrap = document.getElementById("tablewrap");
    if (!ids.length) { wrap.innerHTML = '<div class="empty">No listings match this view yet. Scan a listing by ID above, or run the tracker on your BD listings page.</div>'; return; }
    var rows = ids.map(function (id) {
      var s = DATA[id], g = gaps(s), tg = totalGaps(s), code = String(g.group_status), meta = statusMeta(code);
      var redoFlag = editedSince(s) ? '<div class="redo">&#9888; Edited after your notice &mdash; re-review</div>' : "";
      var statusCell = tg > 0
        ? (grpHtml("Photos", g.photo) + grpHtml("Listing", g.listing) + grpHtml("Profile", g.profile) + ((!g.scanned && s.items && s.items.length) ? grpHtml("Flagged", s.items) : ""))
        : (g.scanned ? '<span class="complete">&#10003; Looks complete</span>' : '<span class="muted">Not scanned</span>');
      var land = s.landlord || {};
      var landCell = land.email ? esc(land.email) : (land.userId ? ('member ' + esc(land.userId)) : '<span class="muted">unknown</span>');
      var emailCell = s.notifyCount ? ("&#9993; " + s.notifyCount + "&times;<br><span class='muted'>last " + esc(d10(s.lastNotified || s.date)) + "</span>") : '<span class="muted">Not emailed</span>';
      // ANY listing with a landlord can be emailed now, live or not.
      // Publication is no longer the goal - matching is - so a LIVE listing
      // with weak photos is exactly one worth writing about. The TONE changes
      // rather than the availability: live listings get the "improve" framing,
      // which never claims the listing has been set back to draft.
      // tg === 0 still qualifies, because a note may be the only reason to
      // write - construction equipment in a photo is not a MISSING photo, so
      // no scanner flags it.
      var canEmail = !!(land.userId || land.email);
      var actions = '<div class="actions">'
        + (canEmail ? '<button class="btn-email" data-email="' + esc(id) + '">' + (s.notifyCount ? "Email again" : "Email landlord") + '</button>' : '')
        + '<button class="btn-scan" data-scan="' + esc(id) + '">Re-scan</button>'
        + (canEmail ? '<textarea class="note" data-note="' + esc(id) + '" rows="2" placeholder="Anything else to mention (optional)"></textarea>' : '')
        + '</div>';
      var dateHtml = "";
      if (g.created || g.lastEdit) {
        dateHtml = '<div class="dates">' + (g.created ? ("Created " + esc(fmtDate(g.created))) : "") + (g.lastEdit ? ((g.created ? " &middot; " : "") + "Edited " + esc(fmtDate(g.lastEdit))) : "") + '</div>';
      }
      return '<tr>'
        + '<td><span class="name">' + esc(s.listingName || ("Listing " + id)) + '</span><span class="idpill">ID ' + esc(id) + '</span><br>'
        + '<span class="tag ' + meta.cls + '">' + esc(meta.label) + '</span>' + dateHtml + redoFlag + '</td>'
        + '<td>' + statusCell + '</td>'
        + '<td>' + landCell + '</td>'
        + '<td class="emailinfo">' + emailCell
        + (canEmail ? ('<div class="tonepill ' + (isLive(code) ? "improve" : "draft") + '">' + (isLive(code) ? "suggestion" : "draft notice") + '</div>') : "")
        + '</td>'
        + '<td class="actions">' + actions + '</td>'
        + '</tr>';
    }).join("");
    wrap.innerHTML = '<table><thead><tr><th>Listing</th><th>What it needs</th><th>Landlord</th><th>Emailed</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table>';
    wireRowButtons();
  }

  function wireRowButtons() {
    var eb = document.querySelectorAll("[data-email]");
    for (var i = 0; i < eb.length; i++) {
      (function (btn) {
        var id = btn.getAttribute("data-email"), armed = false, timer = null;
        var s = DATA[id], land = s.landlord || {}, g = gaps(s);
        var to = land.email || ("member " + land.userId);
        var IDLE = btn.textContent;
        // The address lives in the tooltip now rather than the label, because
        // the label has to stay a fixed width or the button moves when armed.
        btn.title = "Send to " + to;
        btn.onclick = function () {
          if (!armed) {
            armed = true;
            btn.classList.add("armed");
            btn.textContent = "Confirm send";
            timer = setTimeout(function () { armed = false; btn.classList.remove("armed"); btn.textContent = IDLE; }, 6000);
            return;
          }
          btn.classList.remove("armed");
          if (timer) clearTimeout(timer);
          btn.disabled = true; btn.textContent = "Sending…";
          var sendListing = g.photo.concat(g.listing), sendProfile = g.profile;
          // A LIVE listing gets the suggestion framing. The draft wording
          // asserts the listing has been set back to draft, which is simply
          // untrue for anything already published.
          var tone = isLive(String(g.group_status)) ? "improve" : "draft";
          var noteEl = document.querySelector('[data-note="' + id + '"]');
          var note = noteEl ? String(noteEl.value || "").trim() : "";
          fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: KEY, postId: id, memberId: land.userId || "", email: land.email || "", listingReasons: sendListing, profileReasons: sendProfile, missing: note, tone: tone }) })
            .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
            .then(function (res) {
              if (res.ok && res.j && res.j.success) {
                s.notifyCount = res.j.notifyCount || ((s.notifyCount || 0) + 1);
                s.lastNotified = new Date().toISOString(); s.to = res.j.email || land.email;
                toast("Emailed " + (res.j.email || to)); render();
              } else { btn.disabled = false; btn.textContent = "Failed - retry"; toast("Email failed: " + ((res.j && res.j.error) || "error")); }
            })
            .catch(function (e) { btn.disabled = false; btn.textContent = "Error - retry"; toast("Error: " + e.message); });
        };
      })(eb[i]);
    }
    var sb = document.querySelectorAll("[data-scan]");
    for (var k = 0; k < sb.length; k++) {
      (function (btn) {
        var id = btn.getAttribute("data-scan");
        btn.onclick = function () {
          btn.disabled = true; btn.textContent = "Scanning…";
          scanId(id).then(function (okmsg) { toast(okmsg); render(); }).catch(function (e) { btn.disabled = false; btn.textContent = "Re-scan"; toast("Scan failed: " + e.message); });
        };
      })(sb[k]);
    }
  }

  function scanId(id) {
    return fetch(FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: KEY, scanPost: id }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !(res.j && res.j.gaps)) throw new Error((res.j && (res.j.error || res.j.detail)) || "no response");
        // Re-pull the saved record so we get landlord + notify history too.
        return load().then(function () { return "Scanned listing " + id; });
      });
  }

  function load() {
    return fetch(FN + "?statuses=1&cb=" + Date.now(), { headers: { "x-admin-key": KEY } })
      .then(function (r) {
        if (r.status === 401) { throw new Error("unauthorized"); }
        return r.json();
      })
      .then(function (idx) { DATA = idx || {}; var u = document.getElementById("updated"); u.textContent = "Updated " + new Date().toLocaleTimeString(); return DATA; });
  }

  document.getElementById("refresh").onclick = function () { load().then(render).catch(function (e) { toast("Load failed: " + e.message); }); };
  document.getElementById("filters").onclick = function (e) {
    if (e.target.tagName !== "BUTTON") return;
    var bs = this.querySelectorAll("button"); for (var i = 0; i < bs.length; i++) bs[i].classList.remove("active");
    e.target.classList.add("active"); FILTER = e.target.getAttribute("data-f"); render();
  };
  document.getElementById("search").oninput = function () { SEARCH = this.value.trim().toLowerCase(); render(); };
  document.getElementById("scanbtn").onclick = function () {
    var id = document.getElementById("scanid").value.trim(); if (!id) { toast("Enter a listing ID"); return; }
    this.disabled = true; this.textContent = "…";
    var self = this;
    scanId(id).then(function (m) { toast(m); document.getElementById("scanid").value = ""; render(); }).catch(function (e) { toast("Scan failed: " + e.message); }).then(function () { self.disabled = false; self.textContent = "Scan"; });
  };

  function showApp() { document.getElementById("unlock").style.display = "none"; }
  function showUnlock(msg) {
    var u = document.getElementById("unlock"); u.style.display = "flex";
    document.getElementById("unlockerr").textContent = msg || "";
    document.getElementById("unlockkey").focus();
  }
  function tryLoad() {
    return load().then(function () { showApp(); render(); })
      .catch(function (e) {
        if (e && e.message === "unauthorized") { KEY = ""; sessionStorage.removeItem("rdc_key"); showUnlock("That key didn't work. Try again."); }
        else { showApp(); document.getElementById("tablewrap").innerHTML = '<div class="empty">Could not load data (' + esc(e.message) + ').</div>'; }
      });
  }
  document.getElementById("unlockbtn").onclick = function () {
    var v = document.getElementById("unlockkey").value.trim();
    if (!v) { document.getElementById("unlockerr").textContent = "Enter your key."; return; }
    KEY = v; sessionStorage.setItem("rdc_key", v); document.getElementById("unlockerr").textContent = "Checking…"; tryLoad();
  };
  document.getElementById("unlockkey").addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("unlockbtn").click(); });

  if (KEY) tryLoad(); else showUnlock("");
})();
</script>
</body>
</html>
