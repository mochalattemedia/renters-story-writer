<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lead Hub — Renters.com</title>
<link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',sans-serif;background:#eef2f5;color:#0d2d4e;height:100vh;overflow:hidden}
.top{height:54px;background:#0d2d4e;color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px}
.brand{font-size:15px;font-weight:800}
.brand span{color:#8dc63f}
.counts{display:flex;gap:15px;margin-left:auto;align-items:center}
.count{font-size:11px;color:#b8c6d4;line-height:1.25}
.count b{color:#fff;font-size:15px;display:block}
.tbtn{background:#0a2440;border:none;color:#cfe0f0;font:inherit;font-size:12px;padding:7px 13px;border-radius:7px;cursor:pointer}
.tbtn:hover{background:#123a63}
.tbtn:disabled{opacity:.5;cursor:default}
.shell{display:flex;height:calc(100vh - 54px)}
#map{flex:1;min-width:0}
.side{width:420px;flex:none;background:#fff;border-left:1px solid #dde3ea;display:flex;flex-direction:column}
.filters{padding:10px 13px;border-bottom:1px solid #eef2f5;display:flex;gap:6px;flex-wrap:wrap}
.filters select,.filters input{font:inherit;font-size:12px;padding:6px 8px;border:1px solid #dde3ea;border-radius:6px;background:#fff;color:#0d2d4e}
.filters input{flex:1;min-width:90px}
.queue{flex:1;overflow:auto}
.row{padding:10px 13px;border-bottom:1px solid #f2f5f8;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.row:hover{background:#f7fafc}
.row.sel{background:#eaf4fb;border-left:3px solid #3a9e8f;padding-left:10px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
.nm{font-size:13px;font-weight:600;line-height:1.3}
.meta{font-size:11px;color:#7b8a99;margin-top:2px;line-height:1.5}
.tag{margin-left:auto;flex:none;font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;background:#eef2f5;color:#5b6b7d;white-space:nowrap}
.tag.ok{background:#eafaf1;color:#1e8449}
.tag.no{background:#fdf0e6;color:#a1620d}
.detail{border-top:2px solid #eef2f5;max-height:58%;overflow:auto;background:#fbfcfd}
.dh{padding:12px 15px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh h2{font-size:15px;font-weight:700}
.kv{display:grid;grid-template-columns:112px 1fr;gap:3px 10px;padding:0 15px 10px;font-size:12.5px}
.kv dt{color:#7b8a99}
.words{margin:0 15px 10px;padding:9px 12px;background:#fff;border:1px solid #e6ebf0;border-radius:8px;font-size:12.5px;line-height:1.6;color:#4a5a6a}
.words b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8593a4;margin-bottom:3px}
.ops{margin:0 15px 10px;padding:9px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;font-size:12px;line-height:1.6;color:#7c2d12}
.ops b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.acts{padding:10px 15px 15px;display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid #eef2f5;background:#fff;position:sticky;bottom:0}
.btn{font:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:7px;border:none;cursor:pointer}
.go{background:#3a9e8f;color:#fff;flex:1}
.ghost{background:#fff;color:#5b6b7d;border:1px solid #dde3ea}
.empty{padding:30px 20px;text-align:center;color:#8593a4;font-size:13px;line-height:1.7}
.msg{font-size:11.5px;padding:0 15px 10px;min-height:16px}
.leaflet-popup-content{font-family:'Open Sans',sans-serif;font-size:12.5px;margin:10px 12px;line-height:1.5}
.leaflet-popup-content b{display:block;margin-bottom:2px}
</style>
</head>
<body>
<div class="top">
  <div class="brand">RENTERS<span>.</span> Lead Hub</div>
  <button class="tbtn" id="bRefresh">Refresh from BD</button>
  <div class="counts">
    <div class="count">Indexed<b id="cAll">—</b></div>
    <div class="count">Consented<b id="cCon">—</b></div>
    <div class="count">Showing<b id="cShow">—</b></div>
    <div class="count">Listings<b id="cLst">—</b></div>
    <div class="count">Built<b id="cBuilt" style="font-size:11px;font-weight:400">—</b></div>
  </div>
</div>

<div class="shell">
  <div id="map" style="position:relative"></div>
  <div style="position:absolute;left:14px;bottom:14px;z-index:500;background:#fff;border:1px solid #dde3ea;border-radius:9px;padding:9px 12px;font-size:11.5px;line-height:1.9;box-shadow:0 2px 10px rgba(0,0,0,.09)">
    <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#3a9e8f;border:2px solid #fff;box-shadow:0 0 0 1px #cfd8e0;vertical-align:-1px"></span> Running search, or consented lead</div>
    <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#BA7517;border:2px solid #fff;box-shadow:0 0 0 1px #cfd8e0;vertical-align:-1px"></span> Paused, or no consent yet</div>
    <div><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#0d2d4e;vertical-align:0"></span> Live listing</div>
  </div>
  <div class="side">
    <div class="filters">
      <select id="fSource">
        <option value="">Everything</option>
        <option value="search">Searches</option>
        <option value="lead">Get Matched</option>
      </select>
      <select id="fConsent">
        <option value="">Any status</option>
        <option value="1">Workable</option>
        <option value="0">Not workable</option>
      </select>
      <select id="fTiming">
        <option value="">Any timing</option>
        <option>Immediately</option>
        <option>Next month</option>
        <option>3 to 6 months</option>
        <option>6 to 12 months</option>
      </select>
      <input id="fText" placeholder="Name, city, lead #">
    </div>
    <div class="queue" id="queue"><div class="empty">Loading…</div></div>
    <div class="detail" id="detail"><div class="empty">Select a request.</div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   lead-hub.html  ·  lh-v2  (2026-08-13)  TWO SOURCES, ONE MAP.

   lh-v2 adds SEARCHES alongside the Get Matched leads. They are
   different objects with different histories and they are NOT merged
   into one another - they are shaped alike so one renderer can draw
   both, and tagged so you always know which you are looking at.

   WHY IT MATTERS: lead-index walks BD lead records ONE AT A TIME,
   climbing down from the newest id, because BD's list endpoint returns
   the OLDEST hundred and ignores offset. That is why the header says
   "built 5 days ago" - it is a snapshot. SEARCHES DO NOT INHERIT THAT.
   alerts-prefs has been writing a demand index to Blobs on every save
   since ap-v5, so ?demand=1 returns every renter with a search in ONE
   request, live, with no BD calls and no throttle risk.

   ⭐ AND CONSENT STOPS BEING A SEPARATE THING. For a search, RUNNING IS
   THE CONSENT: a renter who builds a housing request and leaves it
   running is asking to be introduced, and pausing withdraws it. The old
   per-field opt-in produced 102 indexed requests and ZERO consents - a
   flow nobody finished is not consent, it is a wall. Legacy leads keep
   their consent flag because that is what they were captured under.
   ============================================================ */
var HUB_VERSION = "lh-v2";
var IDX = "/.netlify/functions/lead-index";
var DEM = "/.netlify/functions/alerts-prefs";
var CON = "/.netlify/functions/lead-consent";
var PRV = "/.netlify/functions/provider-index";
var CONSENT_PAGE = "/lead-consent-page.html";
/* The admin key travels in the URL: hub.html?key=XXXX. Kept out of the
   source so the page can be public while the data behind it is not. It is
   remembered in sessionStorage so a refresh does not lose it, and stripped
   from the visible address bar so it is not read over a shoulder. */
var KEY = new URLSearchParams(location.search).get("key") || sessionStorage.getItem("rdcHubKey") || "";
if (new URLSearchParams(location.search).get("key")) {
  sessionStorage.setItem("rdcHubKey", KEY);
  history.replaceState(null, "", location.pathname);
}
function k(u){ return KEY ? (u + (u.indexOf("?") === -1 ? "?" : "&") + "key=" + encodeURIComponent(KEY)) : u; }
var LEADS = [], CONSENT = {}, PROVIDERS = [], LISTINGS = [], sel = null, builtAt = null;
var DEMAND = [], demandErr = null;

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function el(id){return document.getElementById(id);}
function ago(iso){ if(!iso) return ""; var d=(Date.now()-new Date(iso).getTime())/86400000;
  if(d<1) return "today"; if(d<2) return "yesterday"; if(d<30) return Math.floor(d)+" days ago";
  return Math.floor(d/30)+" months ago"; }

var map = L.map("map",{zoomControl:true}).setView([39.5,-98.35],4);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"&copy; OpenStreetMap, &copy; CARTO",maxZoom:19}).addTo(map);
var layer = L.layerGroup().addTo(map);

/* Everything on the map and in the queue, both sources together. */
function allRows(){ return LEADS.concat(DEMAND); }

/* WORKABLE, not "consented". For a SEARCH, running IS the consent - the
   renter built a housing request and left it on. For a LEGACY LEAD it is
   still the per-field consent flag, because that is what it was captured
   under and nothing retroactively consents it. One question, two ways of
   answering it depending on where the row came from. */
function workable(l){
  return l.kind === "search" ? !!l.enabled : !!CONSENT[l.id];
}

/* Colour says whether it can be acted on. A request nobody can be
   introduced to is not workable however good it looks. */
function colour(l){ return workable(l) ? "#3a9e8f" : "#BA7517"; }

function visible(){
  var c = el("fConsent").value, t = el("fTiming").value, q = el("fText").value.toLowerCase().trim();
  var src = el("fSource") ? el("fSource").value : "";
  return allRows().filter(function(l){
    if (src === "search" && l.kind !== "search") return false;
    if (src === "lead" && l.kind === "search") return false;
    if (c === "1" && !workable(l)) return false;
    if (c === "0" && workable(l)) return false;
    /* Timing only exists on legacy leads. Filtering on it would silently
       hide every search, so a timing filter narrows the leads and leaves
       the searches alone rather than pretending they failed a test they
       were never given. */
    if (t && l.kind !== "search" && l.timing !== t) return false;
    if (q && (l.name+" "+l.location+" "+(l.title||"")+" "+l.id).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function drawMap(list){
  layer.clearLayers();
  var pts = [];
  /* Listings first, so lead pins draw on top of them. Small solid navy dots
     against larger ringed circles for leads - the two must never be
     mistakable for each other, which is the whole point of the map. */
  LISTINGS.forEach(function(x){
    if (!x.lat || !x.lon || !x.live) return;
    var own = PROVIDERS.filter(function(p){return String(p.id)===String(x.ownerId);})[0];
    L.circleMarker([x.lat,x.lon],{radius:4,color:"#0d2d4e",weight:1,fillColor:"#0d2d4e",fillOpacity:.55})
      .bindPopup("<b>"+esc(x.title||("Listing #"+x.id))+"</b>"+
        esc(x.location||"")+(x.rent?"<br>$"+x.rent.toLocaleString()+" a month":"")+
        (x.beds?" &middot; "+esc(x.beds)+" bed":"")+
        (own?"<br>"+esc(own.name||own.company||("Member #"+x.ownerId)):""))
      .addTo(layer);
  });
  list.forEach(function(l){
    if (!l.lat || !l.lon) return;
    pts.push([l.lat,l.lon]);
    var m = L.circleMarker([l.lat,l.lon],{radius:sel===l.id?11:8,color:"#fff",weight:2,fillColor:colour(l),fillOpacity:.95}).addTo(layer);
    m.bindPopup("<b>"+esc(l.name||("Lead #"+l.id))+"</b>"+esc(l.location)+"<br>"+esc(l.budget||"budget not given")+"<br>"+(CONSENT[l.id]?"Consent on file":"No consent yet"));
    m.on("click",function(){ sel=l.id; render(); });
  });
  LISTINGS.forEach(function(x){ if (x.lat && x.lon && x.live) pts.push([x.lat,x.lon]); });
  if (pts.length && !window.__fitted) { try { map.fitBounds(pts,{padding:[40,40],maxZoom:9}); window.__fitted=1; } catch(e){} }
}

function drawQueue(list){
  var q = el("queue");
  if (!list.length) { q.innerHTML="<div class='empty'>Nothing matches those filters.</div>"; return; }
  q.innerHTML = list.map(function(l){
    return "<div class='row"+(sel===l.id?" sel":"")+"' data-i='"+l.id+"'>"+
      "<span class='dot' style='background:"+colour(l)+"'></span>"+
      "<div style='min-width:0'><div class='nm'>"+esc(l.name||("Lead #"+l.id))+"</div>"+
      "<div class='meta'>"+
        (l.kind==="search"
          ? esc(l.title||l.location)+" &middot; "+esc(l.budget||"no ceiling")+"<br>"+
            esc(l.location)+" &middot; "+ago(l.submitted)
          : esc(l.location||"no location")+" &middot; "+esc(l.budget||"—")+"<br>"+
            esc(l.timing||"—")+" &middot; "+ago(l.submitted))+
      "</div></div>"+
      "<span class='tag "+(workable(l)?"ok":"no")+"'>"+
        (l.kind==="search" ? (l.enabled?"running":"paused") : (CONSENT[l.id]?"consented":"no consent"))+
      "</span></div>";
  }).join("");
  Array.prototype.forEach.call(q.querySelectorAll(".row"),function(r){
    r.onclick=function(){ sel=r.getAttribute("data-i"); render(); };
  });
}

/* THE PACKET. What a landlord actually receives, rendered exactly as it
   would be sent, so there is never a gap between what this screen shows
   and what goes out.
   🔴 WHAT IS DELIBERATELY ABSENT, and it is a decision: NOTES. A renter's
   free text says things like "decent but not great credit" and names a
   child's school. Under the old model that sat behind a per-field opt-in;
   under this one it would travel automatically. Credit self-disclosure and
   children riding along to a landlord is how a good feature becomes a Fair
   Housing problem. Notes stays for matching and concierge and is shown
   here ONLY in the operator-only block. Income, credit and employer are
   not captured on a search at all.
   ⚖️ CURRENT ZIP, NEVER AN ADDRESS. And miles, never a read: "950 miles"
   is arithmetic on two things the renter told us. "Out-of-state, expect a
   video tour" is a prediction about a consumer used for a housing
   decision, and it is not ours to make. */
function drawSearchDetail(l, d){
  function kv(k,v){ return v ? "<dt>"+k+"</dt><dd>"+esc(v)+"</dd>" : ""; }
  var c = l.criteria || {};
  var zips = l.searchZips || [];
  var dist = null;
  if (l.lat && l.lon && l.homeLat && l.homeLon) dist = miles(l.homeLat,l.homeLon,l.lat,l.lon);

  var pets = (c.pets||[]).map(function(p){
    return p.species + (p.count>1?(" x"+p.count):"") + (p.weight_lbs?(" "+p.weight_lbs+"lb"):"");
  }).join(", ");

  d.innerHTML =
    "<div class='dh'><h2>"+esc(l.name)+"</h2>"+
      "<span class='tag "+(l.enabled?"ok":"no")+"'>"+(l.enabled?"running":"paused")+"</span>"+
      (l.verified ? "<span class='tag ok'>verified</span>" : "")+
      "<span class='tag' style='margin-left:auto'>member #"+esc(l.memberId)+"</span></div>"+

    "<dl class='kv'>"+
      kv("Search", l.title)+
      kv("Zone", l.zone && l.zone.name)+
      kv("Zip codes", zips.length ? zips.join(", ") : null)+
      kv("Email", l.email)+
      kv("Phone", l.phone)+
      kv("Currently in", l.currentZip ? (l.currentZip + (l.currentCity?(" · "+l.currentCity):"")) : null)+
      kv("Household", l.household ? (l.household.total + " people, " + l.household.adults + " adults") : null)+
      kv("Pets", pets)+
      kv("Voucher", c.voucher ? ("Yes" + (c.voucher_program?(" · "+c.voucher_program):"")) : null)+
      kv("Move in from", c.move_in_earliest)+
      kv("Needs to be in by", c.move_in_latest)+
      kv("Must have", (c.must_have||[]).join(", "))+
      kv("Will not accept", (c.deal_breakers||[]).join(", "))+
      kv("Nice to have", (c.nice_to_have||[]).join(", "))+
      kv("Created", ago(l.submitted))+
    "</dl>"+

    /* Any ONE of these being satisfied is a match. That is the whole
       reason the options model exists: a 1,900 condo must not fire on a
       2,000 house budget, because a lead that fails on type or price
       fails twice - once for the renter and once for the landlord who
       paid for it. */
    "<div style='padding:0 15px 10px'>"+
      "<div style='font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8593a4;margin:0 0 6px'>"+
        "Any one of these works &mdash; "+(l.options||[]).length+"</div>"+
      (l.options||[]).map(function(o){
        return "<div style='padding:7px 10px;border:1px solid #e6ebf0;border-radius:8px;margin:0 0 5px;background:#fff;font-size:12px'>"+
          esc(optionLine(o))+"</div>";
      }).join("")+
    "</div>"+

    (c.notes ? "<div class='ops'><b>Operator only &mdash; never sent to a landlord</b>"+esc(c.notes)+
      "<br>Free text can name a child's school or a credit position. It is here for matching and concierge, and it does not travel.</div>" : "")+

    (function(){
      var nb = nearbyFor(l);
      if (!l.lat || !l.lon) return "<div class='ops' style='background:#f4f7f6;border-color:#e6ebf0;color:#7b8a99'><b>No drawn zone</b>This search has zip codes but no polygon, so it cannot be placed on the map. Searches created before the zone picker was embedded look like this.</div>";
      if (!nb.length) return "<div class='ops'><b>No live listings within 40 miles</b>A supply gap, not a bad request.</div>";
      return "<div style='padding:0 15px 10px'><div style='font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8593a4;margin:0 0 6px'>Live listings within 40 miles of their zone &mdash; "+nb.length+"</div>"+
        nb.map(function(x){
          return "<div style='display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid #e6ebf0;border-radius:8px;margin:0 0 5px;background:#fff;font-size:12px'>"+
            "<div style='min-width:0;flex:1'><div style='font-weight:600'>"+esc(x.title||("Listing #"+x.id))+"</div>"+
            "<div style='font-size:11px;color:#7b8a99'>"+(x.owner?esc(x.owner.name||x.owner.company||("Member #"+x.ownerId)):"owner unknown")+
            (x.rent?" &middot; $"+x.rent.toLocaleString():"")+
            (x.beds?" &middot; "+esc(x.beds)+" bed":"")+"</div></div>"+
            "<span style='font-size:11px;color:#7b8a99;white-space:nowrap'>"+x.d.toFixed(1)+" mi</span></div>";
        }).join("")+"</div>";
    })()+
    "<div class='msg' id='dmsg'></div>";
}

function drawDetail(){
  var d = el("detail");
  if (!sel) { d.innerHTML="<div class='empty'>Select a request.</div>"; return; }
  var l = allRows().filter(function(x){return x.id===sel;})[0];
  if (!l) { d.innerHTML="<div class='empty'>Select a request.</div>"; return; }
  if (l.kind === "search") { drawSearchDetail(l, d); return; }
  var has = !!CONSENT[l.id];
  var link = CONSENT_PAGE+"?id="+encodeURIComponent(l.id)+"&token="+encodeURIComponent(l.token);

  function kv(k,v){ return v ? "<dt>"+k+"</dt><dd>"+esc(v)+"</dd>" : ""; }

  d.innerHTML =
    "<div class='dh'><h2>"+esc(l.name||("Lead #"+l.id))+"</h2>"+
      "<span class='tag "+(has?"ok":"no")+"'>"+(has?"consent on file":"no consent yet")+"</span>"+
      "<span class='tag' style='margin-left:auto'>#"+esc(l.id)+"</span></div>"+
    "<dl class='kv'>"+
      kv("Submitted", ago(l.submitted))+
      kv("Looking in", (l.searchAreas && l.searchAreas.length) ? l.searchAreas.join(" &middot; ") : null)+
      kv("Current location", l.location)+
      kv("Budget", l.budget)+
      kv("Move by", l.timing)+
      kv("Term", l.term)+
      kv("Property type", l.propertyType)+
      kv("Household", l.household)+
      kv("Pets", l.pets)+
      kv("Pet details", l.petDetails)+
      kv("Co-signer", l.cosigner)+
      kv("Renting for", l.rentingFor)+
      kv("Searching on", l.searchingOn)+
    "</dl>"+
    (l.description ? "<div class='words'><b>In their own words</b>"+esc(l.description)+"</div>" : "")+
    (l.obstacles ? "<div class='words'><b>Worth knowing upfront</b>"+esc(l.obstacles)+"</div>" : "")+
    ((l.income||l.incomeSource) ?
      "<div class='ops'><b>Operator only &mdash; never sent to a provider</b>"+
      (l.income?("Earns "+esc(l.income)+" a month"):"")+
      (l.income&&l.incomeSource?" &middot; ":"")+
      (l.incomeSource?esc(l.incomeSource):"")+
      "<br>Use this to judge whether an introduction makes sense. Income source is not shareable at all, and the amount only goes out if the renter ticked it.</div>" : "")+
    (function(){
      var nb = nearbyFor(l);
      var pts = searchPoints(l);
      if (!pts.length) return "<div class='ops' style='background:#f4f7f6;border-color:#e6ebf0;color:#7b8a99'><b>No coordinates</b>This request has no location, so nearby supply cannot be worked out.</div>";
      var basis = (l.searchGeo && l.searchGeo.length)
        ? ("their " + l.searchGeo.length + " search area" + (l.searchGeo.length===1?"":"s"))
        : "their current location, as no search areas were set";
      if (!nb.length) return "<div class='ops'><b>No live listings within 40 miles</b>A supply gap, not a bad lead. Worth noting where these cluster.</div>";
      return "<div style='padding:0 15px 10px'><div style='font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8593a4;margin:0 0 6px'>Live listings within 40 miles of "+esc(basis)+" &mdash; "+nb.length+"</div>"+
        nb.map(function(x){
          var fits = (l.budget && x.rent) ? null : null;
          return "<div style='display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid #e6ebf0;border-radius:8px;margin:0 0 5px;background:#fff;font-size:12px'>"+
            "<div style='min-width:0;flex:1'><div style='font-weight:600'>"+esc(x.title||("Listing #"+x.id))+"</div>"+
            "<div style='font-size:11px;color:#7b8a99'>"+(x.owner?esc(x.owner.name||x.owner.company||("Member #"+x.ownerId)):"owner unknown")+
            (x.owner&&x.owner.plan?" &middot; "+esc(x.owner.plan):"")+
            (x.rent?" &middot; $"+x.rent.toLocaleString():"")+
            (x.beds?" &middot; "+esc(x.beds)+" bed":"")+"</div></div>"+
            "<span style='font-size:11px;color:#7b8a99;white-space:nowrap'>"+x.d.toFixed(1)+" mi</span></div>";
        }).join("")+"</div>";
    })()+
    "<div class='msg' id='dmsg'></div>"+
    "<div class='acts'>"+
      "<button class='btn ghost' id='bCopy'>Copy consent link</button>"+
      (has ? "<button class='btn go' id='bView'>View what they approved</button>"
           : "<a class='btn go' style='text-decoration:none;text-align:center;line-height:1.6' href='"+link+"' target='_blank'>Open consent page</a>")+
    "</div>";

  el("bCopy").onclick = function(){
    var full = location.origin + link;
    navigator.clipboard.writeText(full).then(function(){
      el("dmsg").textContent = "Copied. Send this to the renter.";
    }).catch(function(){ el("dmsg").textContent = full; });
  };
  var bv = el("bView");
  if (bv) bv.onclick = function(){
    el("dmsg").textContent = "Loading…";
    fetch(k(CON+"?leadId="+encodeURIComponent(l.id))).then(function(r){return r.json();}).then(function(x){
      if (x && x.consented && x.record) {
        el("dmsg").innerHTML = "<div class='words' style='margin:8px 0 0'><b>Approved "+esc(new Date(x.record.consentedAt).toLocaleString())+" &mdash; "+x.record.fields.length+" fields</b>"+esc(x.record.profileText)+"</div>";
      } else { el("dmsg").textContent = "No consent record found."; }
    }).catch(function(e){ el("dmsg").textContent = "Could not load: "+e; });
  };
}

function render(){
  var list = visible();
  drawMap(list); drawQueue(list); drawDetail();
  el("cAll").textContent = allRows().length;
  /* Workable, both sources. Running searches plus consented legacy leads.
     This number is the one that answers "how much demand can we act on
     right now", which the old consent count could not because it only
     ever described the half nobody completed. */
  el("cCon").textContent = allRows().filter(workable).length;
  el("cShow").textContent = list.length;
  el("cLst").textContent = LISTINGS.filter(function(x){return x.live;}).length;
  el("cBuilt").textContent = builtAt ? ago(builtAt) : "—";
}

function miles(a,b,c,d){var R=3958.8,p=Math.PI/180;
  var x=0.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;
  return R*2*Math.asin(Math.sqrt(x));}

/* Match against WHERE THEY ARE LOOKING, not where they live.
   BD's form captures one location, labelled "Your Current Location", so
   matching on it meant an Ohio renter searching Utah was shown Ohio
   listings. searchGeo holds their zone-picker areas, geocoded. A listing is
   near them if it is near ANY of those areas.
   Leads without searchGeo predate this and fall back to their own
   coordinates, which is correct for anyone searching locally. */
function searchPoints(l){
  if (l.searchGeo && l.searchGeo.length) return l.searchGeo;
  if (l.lat && l.lon) return [{ lat: l.lat, lon: l.lon }];
  return [];
}

function nearbyFor(l){
  var pts = searchPoints(l);
  if (!pts.length) return [];
  return LISTINGS
    .filter(function(x){ return x.lat && x.lon && x.live; })
    .map(function(x){
      var o={}; for(var q in x) o[q]=x[q];
      /* Distance to the CLOSEST of their areas. A renter watching two
         neighbourhoods should see listings near either, not near the point
         between them. */
      o.d = Math.min.apply(null, pts.map(function(p){ return miles(p.lat,p.lon,x.lat,x.lon); }));
      o.owner = PROVIDERS.filter(function(p){return String(p.id)===String(x.ownerId);})[0]||null;
      return o;
    })
    .filter(function(x){ return x.d < 40; })
    .sort(function(a,b){ return a.d-b.d; })
    .slice(0,8);
}

/* ---- SEARCHES -> LEAD-SHAPED ROWS -------------------------------------
   One renderer draws both, so a search has to answer the same questions a
   lead does: who, where, how much, when. Anything a search does not have
   is left null rather than faked, and drawDetail branches on kind. */

/* The pin. BD holds a zip index and nothing else, so the ONLY coordinates
   a search carries are the polygon the renter drew - which is exactly why
   ap-v9 stores the path even though nothing matches on it yet. Centroid of
   the drawn shape is where they want to live, which is the honest pin. A
   zone with zips but no path predates the path being stored and gets no
   pin rather than a guessed one. */
function zoneCentre(z){
  if (!z || !z.path || !z.path.length) return null;
  var la=0, ln=0, n=0;
  z.path.forEach(function(p){
    if (p && isFinite(p.lat) && isFinite(p.lng)) { la+=p.lat; ln+=p.lng; n++; }
  });
  return n ? { lat: la/n, lon: ln/n } : null;
}

function money(n){ return "$" + Number(n).toLocaleString(); }

function optionLine(o){
  var bits = [];
  if (o.unit_types && o.unit_types.length) bits.push(o.unit_types.join(", "));
  if (o.beds && o.beds.length) bits.push(o.beds.join("/") + " bed");
  if (o.baths_min) bits.push(o.baths_min + "+ bath");
  bits.push(o.rent_max ? "up to " + money(o.rent_max) : "no ceiling given");
  return bits.join(" · ");
}

function searchesToRows(members){
  var out = [];
  (members || []).forEach(function(m){
    var contact = m.contact || {};
    (m.searches || []).forEach(function(sr){
      var opts = sr.options || [];
      var centre = zoneCentre(sr.zone);
      var tops = opts.filter(function(o){ return o.rent_max; })
                     .map(function(o){ return o.rent_max; });
      out.push({
        kind: "search",
        /* Prefixed so it can never collide with a BD lead id. */
        id: "s:" + m.memberId + ":" + sr.id,
        memberId: m.memberId,
        name: contact.displayName || ("Member #" + m.memberId),
        email: contact.email || "",
        phone: contact.phone || "",
        currentZip: contact.zip || "",
        currentCity: [contact.city, contact.state].filter(Boolean).join(", "),
        verified: contact.verified || "",
        title: sr.name || "",
        enabled: sr.enabled !== false,
        submitted: sr.created || null,
        updated: sr.updated || null,
        zone: sr.zone || null,
        options: opts,
        household: m.household || null,
        criteria: sr.criteria || {},
        source: sr.source || "form",
        /* Fields the shared renderer reads. */
        location: sr.zone && sr.zone.name ? sr.zone.name : "no zone yet",
        budget: tops.length ? "up to " + money(Math.max.apply(null, tops)) : "",
        timing: "",
        lat: centre ? centre.lat : null,
        lon: centre ? centre.lon : null,
        searchGeo: centre ? [centre] : [],
        searchZips: (sr.zone && sr.zone.zips) || []
      });
    });
  });
  return out;
}

function loadDemand(){
  return fetch(k(DEM + "?demand=1"))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.members) { demandErr = (d && d.error) || "no demand data"; DEMAND = []; return; }
      demandErr = null;
      DEMAND = searchesToRows(d.members);
    })
    .catch(function(e){ demandErr = String(e); DEMAND = []; });
}

function loadProviders(){
  return fetch(k(PRV))
    .then(function(r){return r.json();})
    .then(function(d){ if(d&&d.ok){ PROVIDERS=d.providers||[]; LISTINGS=d.listings||[]; } })
    .catch(function(){ PROVIDERS=[]; LISTINGS=[]; });
}

function loadConsent(){
  if (!LEADS.length) return Promise.resolve();
  var ids = LEADS.map(function(l){return l.id;}).join(",");
  return fetch(k(CON+"?leadIds="+encodeURIComponent(ids)))
    .then(function(r){return r.json();})
    .then(function(d){ CONSENT = (d && d.consent) || {}; })
    .catch(function(){ CONSENT = {}; });
}

function load(refresh){
  var b = el("bRefresh");
  b.disabled = true; b.textContent = refresh ? "Fetching from BD…" : "Loading…";
  fetch(k(IDX + (refresh ? "?refresh=1" : "")))
    .then(function(r){return r.json();})
    .then(function(d){
      /* lead-index failing must not take the searches down with it. They
         come from a different store with none of BD's failure modes, so a
         BD problem should cost the legacy half only. */
      if (!d || !d.ok) {
        LEADS = [];
        return Promise.all([loadProviders(), loadDemand()]).then(function(){
          render();
          if (!DEMAND.length) el("queue").innerHTML="<div class='empty'>"+esc((d&&d.error)||"Could not load leads.")+"</div>";
        });
      }
      LEADS = d.leads || []; builtAt = d.builtAt || null;
      return Promise.all([loadConsent(), loadProviders(), loadDemand()]).then(render);
    })
    .catch(function(e){ el("queue").innerHTML="<div class='empty'>"+esc(String(e))+"</div>"; })
    .finally(function(){ b.disabled=false; b.textContent="Refresh from BD"; });
}

["fSource","fConsent","fTiming","fText"].forEach(function(id){
  el(id).addEventListener("input", function(){ sel=null; render(); });
});
el("bRefresh").onclick = function(){ load(true); };
console.log("[Lead hub] version:", HUB_VERSION);
load(false);
</script>
