<!DOCTYPE html>
<!-- ============================================================
     lead-hub.html   ·   VERSION: lh-v12
     Served at /lead-hub.html. Open with ?key=RDC_ADMIN_KEY.

     THE VERSION LIVES HERE, AT THE TOP OF THE FILE, and it also
     renders beside the brand in the header. Same rule as every
     other file on this project: the version is a receipt, and a
     deploy is not confirmed until the live number changes.
     ⚠️ Placed after <!DOCTYPE html> and never before it - a
     comment ahead of the doctype can drop older browsers into
     quirks mode, which would break the flex layout silently.
     lh-v12: the member id shows on every queue row alongside the name.
     It was only ever a FALLBACK - "Member #4710" appears when contact is
     missing, so the id disappeared the moment a name arrived. An operator
     cross-referencing against BD or a previous conversation needs the
     number, not instead of the name but with it.
     lh-v11: THE JOIN RUNS BOTH WAYS AND CARRIES A COUNT. A Get Matched
     row now says whether they joined AND how many perfect spots they
     built - which splits "joined" into somebody who stopped at signup and
     somebody who went all the way. Only the first is a nudge, and the
     header counter now means JOINED AND BUILT NOTHING rather than joined.
     A perfect spot row says whether that member also has a Get Matched
     record, because that form holds income band, co-signer and their own
     description - things a spot deliberately does not ask for.
     ⚠️ The key is still EMAIL. lead-index exposes no user id on a lead,
     so anyone who signed up with a different address reads as "no
     account". This undercounts conversion, which is the safe direction.
     lh-v10: the two Get Matched labels are now parallel - "joined" and
     "no account" - so the only thing that separates them is the only
     thing that matters. "Joined, no spot yet" carried the Perfect Spot
     vocabulary into a legend read by anyone, and a label that needs the
     glossary is a label that is not working.
     lh-v9: HOVER PREVIEWS AND A TABLE VIEW.
     Reading the map meant clicking every dot and losing the one before
     it; both spots and listings now preview on hover. And a TABLE VIEW
     pairs every listing with every perfect spot inside 40 miles, naming
     what lines up - rent, beds, type - scored against EACH OPTION
     SEPARATELY and keeping the best, because a renter open to a house at
     2000 or a condo at 1000 is not "matched at 2000".
     🔴 It decides nothing. Green means those two agree on that point. A
     person still makes the call, which is the right division of labour
     until a matcher exists and is trusted.
     lh-v8: THE FUNNEL, NOT JUST THE END OF IT. Legacy Get Matched
     requests are back on the map in TWO new colours - navy for someone
     who joined and never built a spot, grey for someone who asked and
     left. lh-v4 removed them because every one rendered amber "no
     consent", a distinction describing a retired model. The distinction
     is real now and it names who to talk to.
     ⚠️ The join is EMAIL and it is only as good as the contact data:
     contact lands in the demand index only on a save made since ap-v11,
     so members who have not saved since read as "no account". The joined
     count is a FLOOR, not a truth, until that backfill runs.
     lh-v7: version block moved to the top of the file.
     lh-v6: version renders in the header, not just the console.

     lh-v5: the object has its name. A PERFECT SPOT is one zone plus what
     would work inside it. "Housing request" could not be reused - that
     belongs to the EXTERNAL Get Matched form, which is how renters arrive
     on the system and which still lands in BD's leads box untouched. Two
     objects sharing one name is what made lh-v1 through v3 describe two
     incompatible things at once.

     ⭐ THE LEGACY GET MATCHED LEADS ARE GONE FROM THIS HUB. It shows one
     object: a PERFECT SPOT - the ZONE a renter drew plus the SPOT they
     described. Nothing else.

     WHY, and the number made the case: 102 legacy leads, CONSENTED 0. Not
     one renter ever finished the per-field opt-in, so not one of those
     rows was ever workable. They also carry a free-text location instead
     of a zone, no priced options, and a consent model that has been
     retired. Keeping them meant every count, colour and filter had to
     describe two incompatible things at once - and the screen ended up
     mostly amber, which read as "paused" when those requests were never
     running in the first place.
     Clean cutover, same as zones. lead-index and lead-consent are NOT
     deleted and still hold the 102 - this hub simply stops reading them.
     Unlinking is not closing.

     THE SOURCE IS alerts-prefs ?demand=1. One request, live, no BD calls:
     no climbing down lead ids, no 220ms pacing, no throttle risk, and none
     of the 400-that-is-identical-to-a-404 ambiguity. Pins move on and off
     the moment a renter pauses a request, which a nightly crawl could
     never do.

     VOCABULARY, fixed here and everywhere:
     PERFECT SPOT     the object, zone plus spot
     ZONE             step one, where
     SPOT             step two, what
     HOUSING REQUEST  the external Get Matched form. A different thing.
     ============================================================ -->

<body>
<div class="top">

  <div class="counts">

    <div class="count">Joined, built nothing<b id="cGap">—</b></div>

    <div class="count">Showing<b id="cShow">—</b></div>
    <div class="count">Listings<b id="cLst">—</b></div>
  </div>
</div>

<div class="shell">
  <div id="map" style="position:relative"></div>
  <div id="grid" style="display:none;overflow:auto;background:#fbfcfd;"></div>
  <div style="position:absolute;left:14px;bottom:14px;z-index:500;background:#fff;border:1px solid #dde3ea;border-radius:9px;padding:9px 12px;font-size:11.5px;line-height:1.9;box-shadow:0 2px 10px rgba(0,0,0,.09)">
    <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#3a9e8f;border:2px solid #fff;box-shadow:0 0 0 1px #cfd8e0;vertical-align:-1px"></span> Running perfect spot</div>
    <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#BA7517;border:2px solid #fff;box-shadow:0 0 0 1px #cfd8e0;vertical-align:-1px"></span> Paused</div>
    <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#0d2d4e;border:2px solid #fff;box-shadow:0 0 0 1px #cfd8e0;vertical-align:-1px"></span> Get Matched, joined</div>
    <div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#9aa8b8;border:2px solid #fff;box-shadow:0 0 0 1px #cfd8e0;vertical-align:-1px"></span> Get Matched, no account</div>
    <div><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#0d2d4e;vertical-align:0"></span> Live listing</div>
  </div>
  <div class="side">
    <div class="filters">
      <select id="fKind">
        <option value="">Everything</option>
        <option value="spot">Perfect spots</option>

      </select>
      <select id="fConsent">
        <option value="">Any status</option>
        <option value="1">Running</option>

        <option value="">Any zone</option>

      <input id="fText" placeholder="Name, zone, zip">
    </div>
    <div class="queue" id="queue"><div class="empty">Loading…</div></div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>


var HUB_VERSION = "lh-v12";
var DEM = "/.netlify/functions/alerts-prefs";
var IDX = "/.netlify/functions/lead-index";
var PRV = "/.netlify/functions/provider-index";
/* The admin key travels in the URL: hub.html?key=XXXX. Kept out of the
   source so the page can be public while the data behind it is not. It is
   remembered in sessionStorage so a refresh does not lose it, and stripped
   from the visible address bar so it is not read over a shoulder. */
var KEY = new URLSearchParams(location.search).get("key") || sessionStorage.getItem("rdcHubKey") || "";
if (new URLSearchParams(location.search).get("key")) {
  sessionStorage.setItem("rdcHubKey", KEY);
  history.replaceState(null, "", location.pathname);
}
function k(u){ return KEY ? (u + (u.indexOf("?") === -1 ? "?" : "&") + "key=" + encodeURIComponent(KEY)) : u; }
var PROVIDERS = [], LISTINGS = [], sel = null;
var DEMAND = [], demandErr = null, memberCount = 0;
var gridOn = false;
var LEADS = [], leadsErr = null, builtAt = null;

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function el(id){return document.getElementById(id);}
function ago(iso){ if(!iso) return ""; var d=(Date.now()-new Date(iso).getTime())/86400000;
  if(d<1) return "today"; if(d<2) return "yesterday"; if(d<30) return Math.floor(d)+" days ago";
  return Math.floor(d/30)+" months ago"; }

var map = L.map("map",{zoomControl:true}).setView([39.5,-98.35],4);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"&copy; OpenStreetMap, &copy; CARTO",maxZoom:19}).addTo(map);
var layer = L.layerGroup().addTo(map);

/* ---- lh-v8: THE FUNNEL, NOT JUST THE END OF IT ----------------------
   Three things live on this map now, and the distinction between them is
   the point:

     PERFECT SPOT      a member who built the real object - zone plus
                       priced options. Teal running, amber paused.
     GET MATCHED, MEMBER   they submitted the external form AND have an
                       account, but never built a spot. NAVY.
                       ⭐ THIS IS THE ACTIONABLE ONE. They are already
                       through the hardest step and stopped one short.
     GET MATCHED, NO ACCOUNT   they asked and left. GREY, low priority,
                       and honest about it.

   lh-v4 removed the legacy leads because every one of them rendered amber
   "no consent" - a distinction that described a retired model and made
   the screen mostly noise. They come back HERE because the distinction is
   now real and tells you who to talk to.

   ⚠️ THE JOIN IS EMAIL, AND IT IS ONLY AS GOOD AS THE CONTACT DATA.
   Contact only lands in the demand index on a save made since ap-v11, so
   members who have not saved since then have NO EMAIL STORED and their
   leads will read as "no account". The count is a FLOOR, not a truth,
   until that backfill runs. Better to under-claim conversion than to
   invent it. */
/* lh-v11: not just WHETHER they joined - what they did afterwards.
   Keyed by email, holding the member id and HOW MANY perfect spots they
   have built. That splits "joined" into two very different people:
   somebody who made an account and stopped, and somebody who went all the
   way through. Only the first is a nudge.

   ⚠️ EMAIL IS THE WEAKEST USABLE KEY AND IT IS THE ONLY ONE WE HAVE.
   lead-index does not expose a user id on the lead record, so anyone who
   signed up with a different address than they used on the form reads as
   "no account". A user-id join would survive that; finding BD's field
   name for it is a probe nobody has run. Until then this UNDERCOUNTS
   conversion, which is the safe direction to be wrong in. */
function memberIndex(){
  var idx = {};
  DEMAND.forEach(function(r){
    var em = String(r.email || "").toLowerCase().trim();
    if (!em) return;
    if (!idx[em]) idx[em] = { memberId: r.memberId, spots: 0, running: 0 };
    idx[em].spots++;
    if (r.enabled) idx[em].running++;
  });
  return idx;
}

/* The link read the other way: does the member behind this perfect spot
   also have a Get Matched request on file? Useful because that form asks
   things a spot never does - income band, co-signer, obstacles - and an
   operator about to make an introduction wants to know it exists. */
function leadForSpot(sp){
  var em = String(sp.email || "").toLowerCase().trim();
  if (!em) return null;
  for (var i = 0; i < LEADS.length; i++) {
    if (String(LEADS[i].email || "").toLowerCase().trim() === em) return LEADS[i];
  }
  return null;
}

function allRows(){ return DEMAND.concat(LEADS); }

/* RUNNING IS THE CONSENT. A renter who builds a housing request and
   leaves it running is asking to be introduced; pausing withdraws it.
   There is no separate flag to check and nothing to chase - which is the
   whole reason the old model was retired at 102 requests and 0 consents. */
function workable(l){
  /* A perfect spot is workable when it is running. A legacy request is
     never "running" - it is a historical submission with no on/off state -
     so it is workable only in the sense that a person can be contacted. */
  return l.kind === "lead" ? true : !!l.enabled;
}

/* Colour says whether it can be acted on. A request nobody can be
   introduced to is not workable however good it looks. */
function colour(l){
  if (l.kind === "lead") return l.isMember ? "#0d2d4e" : "#9aa8b8";
  return l.enabled ? "#3a9e8f" : "#BA7517";
}

function visible(){
  var c = el("fConsent").value, z = el("fZone").value, q = el("fText").value.toLowerCase().trim();
  var kind = el("fKind") ? el("fKind").value : "";
  return allRows().filter(function(l){
    if (kind === "spot" && l.kind === "lead") return false;
    if (kind === "member" && !(l.kind === "lead" && l.isMember)) return false;
    if (kind === "lead" && !(l.kind === "lead" && !l.isMember)) return false;
    /* Running / paused is a PERFECT SPOT idea. A legacy request has no
       such state, so the status filter narrows the spots and leaves the
       requests alone rather than pretending they failed a test they were
       never given. */
    if (c === "1" && l.kind !== "lead" && !l.enabled) return false;
    if (c === "0" && l.kind !== "lead" && l.enabled) return false;
    /* A request with zips but no polygon cannot be placed on the map.
       Being able to isolate those is how you find the ones worth asking
       to redraw. */
    var hasZone = !!(l.lat && l.lon);
    if (z === "1" && !hasZone) return false;
    if (z === "0" && hasZone) return false;
    if (q && (l.name+" "+l.location+" "+(l.title||"")+" "+(l.searchZips||[]).join(" ")).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function drawMap(list){
  layer.clearLayers();
  var pts = [];
  /* Listings first, so lead pins draw on top of them. Small solid navy dots
     against larger ringed circles for leads - the two must never be
     mistakable for each other, which is the whole point of the map. */
  LISTINGS.forEach(function(x){
    if (!x.lat || !x.lon || !x.live) return;
    var own = PROVIDERS.filter(function(p){return String(p.id)===String(x.ownerId);})[0];
    /* lh-v9: listings were a 4px dot with nothing but a click. On a map
       whose entire purpose is reading demand against supply, the supply
       side has to be legible on hover too - and a fraction bigger, because
       4px is not a target. */
    var lm = L.circleMarker([x.lat,x.lon],{radius:5,color:"#fff",weight:1.5,fillColor:"#0d2d4e",fillOpacity:.8})
      .bindPopup("<b>"+esc(x.title||("Listing #"+x.id))+"</b>"+
        esc(x.location||"")+(x.rent?"<br>$"+x.rent.toLocaleString()+" a month":"")+
        (x.beds?" &middot; "+esc(x.beds)+" bed":"")+
        (own?"<br>"+esc(own.name||own.company||("Member #"+x.ownerId)):""))
      .addTo(layer);
    lm.bindTooltip(
      "<b>"+esc(x.title||("Listing #"+x.id))+"</b><br>"+
      esc(x.location||"")+
      (x.rent?"<br>$"+x.rent.toLocaleString()+" a month":"")+
      (x.beds?" &middot; "+esc(x.beds)+" bed":"")+
      (own?"<br>"+esc(own.name||own.company||("Member #"+x.ownerId)):""),
      { direction:"top", offset:[0,-4], opacity:0.97, className:"rdc-tip" }
    );
  });
  list.forEach(function(l){
    if (!l.lat || !l.lon) return;
    pts.push([l.lat,l.lon]);
    var m = L.circleMarker([l.lat,l.lon],{radius:sel===l.id?11:8,color:"#fff",weight:2,fillColor:colour(l),fillOpacity:.95}).addTo(layer);
    m.bindPopup("<b>"+esc(l.name)+"</b>"+esc(l.title||"")+"<br>"+esc(l.location)+"<br>"+
      esc(l.budget||"no ceiling given")+"<br>"+(l.enabled?"Running":"Paused"));

    /* lh-v9: HOVER, NOT CLICK. Reading the map meant clicking every dot
       and losing the one before it. A tooltip on hover lets an operator
       sweep a metro and see who is in it without committing to any of
       them - which is how you actually scan a map. Click still opens the
       full packet. */
    m.bindTooltip(
      "<b>"+esc(l.name)+"</b><br>"+
      esc(l.kind === "lead" ? l.location : (l.title || l.location))+"<br>"+
      esc(l.budget || "no budget given")+
      (l.kind === "lead"
        ? "<br>"+(l.isMember
            ? "Get Matched, joined &middot; "+l.spotCount+" perfect spot"+(l.spotCount===1?"":"s")
            : "Get Matched, no account")
        : "<br>"+((l.options||[]).length)+" option"+(((l.options||[]).length)===1?"":"s")+
          " &middot; "+(l.enabled?"running":"paused")),
      { direction: "top", offset: [0, -6], opacity: 0.97, className: "rdc-tip" }
    );
    m.on("click",function(){ sel=l.id; render(); });
  });
  LISTINGS.forEach(function(x){ if (x.lat && x.lon && x.live) pts.push([x.lat,x.lon]); });
  if (pts.length && !window.__fitted) { try { map.fitBounds(pts,{padding:[40,40],maxZoom:9}); window.__fitted=1; } catch(e){} }
}

function drawQueue(list){
  var q = el("queue");
  if (!list.length) { q.innerHTML="<div class='empty'>Nothing matches those filters.</div>"; return; }
  q.innerHTML = list.map(function(l){
    return "<div class='row"+(sel===l.id?" sel":"")+"' data-i='"+l.id+"'>"+
      "<span class='dot' style='background:"+colour(l)+"'></span>"+
      "<div style='min-width:0'><div class='nm'>"+esc(l.name)+"</div>"+
      "<div class='meta'>"+
        /* lh-v12: THE MEMBER ID IS ALWAYS ON THE ROW. The name only ever
           REPLACED it - "Member #4710" is the fallback when contact is
           missing, so the moment contact lands the id vanishes from the
           list. That makes the queue unscannable by id, which is how an
           operator cross-references against BD, the dashboard, or a
           previous conversation. Both, always. */
        (l.kind === "lead"
          ? (l.memberId ? "<span style='color:#0d2d4e;font-weight:700'>#"+esc(l.memberId)+"</span> &middot; " : "")
          : (l.memberId ? "<span style='color:#0d2d4e;font-weight:700'>#"+esc(l.memberId)+"</span> &middot; " : ""))+
        (l.kind==="lead"
          ? esc(l.location)+" &middot; "+esc(l.budget||"no budget given")+"<br>"+
            esc(l.timing||"no timing")+" &middot; "+ago(l.submitted)
          : esc(l.title||l.location)+" &middot; "+esc(l.budget||"no ceiling")+"<br>"+
            esc(l.location)+" &middot; "+ago(l.submitted))+
      "</div></div>"+
      (l.kind==="lead"
        ? "<span class='tag "+(l.isMember?"ok":"no")+"'>"+
            (l.isMember
              ? (l.spotCount ? "joined &middot; "+l.spotCount+" spot"+(l.spotCount===1?"":"s") : "joined &middot; 0 spots")
              : "no account")+"</span>"
        : "<span class='tag "+(l.enabled?"ok":"no")+"'>"+(l.enabled?"running":"paused")+"</span>")+
      "</div>";
  }).join("");
  Array.prototype.forEach.call(q.querySelectorAll(".row"),function(r){
    r.onclick=function(){ sel=r.getAttribute("data-i"); render(); };
  });
}

/* THE PACKET. What a landlord actually receives, rendered exactly as it
   would be sent, so there is never a gap between what this screen shows
   and what goes out.
   🔴 WHAT IS DELIBERATELY ABSENT, and it is a decision: NOTES. A renter's
   free text says things like "decent but not great credit" and names a
   child's school. Under the old model that sat behind a per-field opt-in;
   under this one it would travel automatically. Credit self-disclosure and
   children riding along to a landlord is how a good feature becomes a Fair
   Housing problem. Notes stays for matching and concierge and is shown
   here ONLY in the operator-only block. Income, credit and employer are
   not captured on a search at all.
   ⚖️ CURRENT ZIP, NEVER AN ADDRESS. And miles, never a read: "950 miles"
   is arithmetic on two things the renter told us. "Out-of-state, expect a
   video tour" is a prediction about a consumer used for a housing
   decision, and it is not ours to make. */
function drawSearchDetail(l, d){
  function kv(k,v){ return v ? "<dt>"+k+"</dt><dd>"+esc(v)+"</dd>" : ""; }
  var c = l.criteria || {};
  var zips = l.searchZips || [];
  var dist = null;
  if (l.lat && l.lon && l.homeLat && l.homeLon) dist = miles(l.homeLat,l.homeLon,l.lat,l.lon);

  var pets = (c.pets||[]).map(function(p){
    return p.species + (p.count>1?(" x"+p.count):"") + (p.weight_lbs?(" "+p.weight_lbs+"lb"):"");
  }).join(", ");

  d.innerHTML =
    "<div class='dh'><h2>"+esc(l.name)+"</h2>"+
      "<span class='tag "+(l.enabled?"ok":"no")+"'>"+(l.enabled?"running":"paused")+"</span>"+
      (l.verified ? "<span class='tag ok'>verified</span>" : "")+
      "<span class='tag' style='margin-left:auto'>member #"+esc(l.memberId)+"</span></div>"+

    "<dl class='kv'>"+
      kv("Search", l.title)+
      kv("Zone", l.zone && l.zone.name)+
      kv("Zip codes", zips.length ? zips.join(", ") : null)+
      kv("Email", l.email)+
      kv("Phone", l.phone)+
      kv("Currently in", l.currentZip ? (l.currentZip + (l.currentCity?(" · "+l.currentCity):"")) : null)+
      kv("Household", l.household ? (l.household.total + " people, " + l.household.adults + " adults") : null)+
      kv("Pets", pets)+
      kv("Voucher", c.voucher ? ("Yes" + (c.voucher_program?(" · "+c.voucher_program):"")) : null)+
      kv("Move in from", c.move_in_earliest)+
      kv("Needs to be in by", c.move_in_latest)+
      kv("Must have", (c.must_have||[]).join(", "))+
      kv("Will not accept", (c.deal_breakers||[]).join(", "))+
      kv("Nice to have", (c.nice_to_have||[]).join(", "))+
      kv("Created", ago(l.submitted))+
    "</dl>"+

    /* Any ONE of these being satisfied is a match. That is the whole
       reason the options model exists: a 1,900 condo must not fire on a
       2,000 house budget, because a lead that fails on type or price
       fails twice - once for the renter and once for the landlord who
       paid for it. */
    "<div style='padding:0 15px 10px'>"+
      "<div style='font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8593a4;margin:0 0 6px'>"+
        "Any one of these works &mdash; "+(l.options||[]).length+"</div>"+
      (l.options||[]).map(function(o){
        return "<div style='padding:7px 10px;border:1px solid #e6ebf0;border-radius:8px;margin:0 0 5px;background:#fff;font-size:12px'>"+
          esc(optionLine(o))+"</div>";
      }).join("")+
    "</div>"+

    (function(){
      var lead = leadForSpot(l);
      if (!lead) return "";
      /* The Get Matched form asks for things a perfect spot deliberately
         does not - income band, co-signer, obstacles - and an operator

      return "<div class='ops' style='background:#eef3fb;border-color:#cddcf0;color:#1c3a63'>" +

    (c.notes ? "<div class='ops'><b>Operator only &mdash; never sent to a landlord</b>"+esc(c.notes)+

    (function(){
      var nb = nearbyFor(l);
      if (!l.lat || !l.lon) return "<div class='ops' style='background:#f4f7f6;border-color:#e6ebf0;color:#7b8a99'><b>No drawn zone</b>This search has zip codes but no polygon, so it cannot be placed on the map. Searches created before the zone picker was embedded look like this.</div>";
      if (!nb.length) return "<div class='ops'><b>No live listings within 40 miles</b>A supply gap, not a bad request.</div>";
      return "<div style='padding:0 15px 10px'><div style='font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8593a4;margin:0 0 6px'>Live listings within 40 miles of their zone &mdash; "+nb.length+"</div>"+

            (x.beds?" &middot; "+esc(x.beds)+" bed":"")+"</div></div>"+

/* ---- lh-v9: THE TABLE. A MANUAL MATCHER. ----------------------------
   The map answers "where is the demand". It cannot answer "which of these
   42 listings should I put in front of which renter", because that needs
   two records side by side with their differences named.
   Every row here is a PAIR: one listing, one perfect spot within 40 miles,
   with the distance and what lines up. Grouped under the listing, because
   the operator's question starts from supply - they have a vacancy and
   want to know who wants it.

   🔴 IT DECIDES NOTHING. Green means "these two agree on this", not "send
   it". A person still makes the call, which is the correct division of
   labour until a matcher exists and is trusted. */
function mark(v, yes, no, unknown){
  if (v === true) return "<span class='mk y'>"+yes+"</span>";
  if (v === "stretch") return "<span class='mk s'>"+yes+" (stretch)</span>";
  if (v === false) return "<span class='mk n'>"+no+"</span>";
  return "<span class='mk u'>"+unknown+"</span>";
}

function drawGrid(){
  var g = el("grid");
  var spots = DEMAND.filter(function(r){ return r.lat && r.lon; });
  var live = LISTINGS.filter(function(x){ return x.lat && x.lon && x.live; });

  if (!live.length) { g.innerHTML = "<div class='empty'>No live listings to match against.</div>"; return; }
  if (!spots.length) { g.innerHTML = "<div class='empty'>No perfect spots with a drawn zone yet. Only a drawn zone can be placed on a map, so only those can be paired with a listing.</div>"; return; }

  var rows = 0;
  var html = "<table><thead><tr>" +
    "<th>Listing / renter</th><th>Where</th><th>Distance</th>" +
    "<th>Rent</th><th>Beds</th><th>Type</th><th>Their ask</th>" +
    "</tr></thead><tbody>";

  live.sort(function(a,b){ return String(a.title||"").localeCompare(String(b.title||"")); });

  live.forEach(function(x){
    var own = PROVIDERS.filter(function(p){return String(p.id)===String(x.ownerId);})[0];

    var pairs = spots.map(function(sp){
      var pts = searchPoints(sp);
      if (!pts.length) return null;
      var d = Math.min.apply(null, pts.map(function(p){ return miles(p.lat,p.lon,x.lat,x.lon); }));
      if (d >= 40) return null;
      return { sp: sp, d: d, sc: scorePair(x, sp) };
    }).filter(Boolean).sort(function(a,b){
      /* Anything that fails on price sinks, however close it is. Distance
         is a convenience; a ceiling is a wall. */
      var ah = a.sc && a.sc.hard ? 1 : 0, bh = b.sc && b.sc.hard ? 1 : 0;
      if (ah !== bh) return ah - bh;
      var ai = a.sc ? a.sc.hits : 0, bi = b.sc ? b.sc.hits : 0;
      if (ai !== bi) return bi - ai;
      return a.d - b.d;
    });

    html += "<tr class='lst'><td>" + esc(x.title || ("Listing #" + x.id)) + "</td>" +
      "<td>" + esc(x.location || "") + "</td><td></td>" +
      "<td>" + (x.rent ? "$" + Number(x.rent).toLocaleString() : "&mdash;") + "</td>" +
      "<td>" + esc(x.beds || "&mdash;") + "</td>" +
      "<td>" + esc(x.propertyType || x.type || "&mdash;") + "</td>" +
      "<td>" + (own ? esc(own.name || own.company || ("Member #" + x.ownerId)) : "") + "</td></tr>";

    if (!pairs.length) {
      html += "<tr><td colspan='7' style='color:#8593a4'>No perfect spot within 40 miles. " +
        "A supply and demand gap, not a bad listing.</td></tr>";
      return;
    }

    pairs.forEach(function(pr){
      var sc = pr.sc || {};
      var o = sc.option || {};
      rows++;
      html += "<tr data-goto='" + esc(pr.sp.id) + "' style='cursor:pointer'>" +
        "<td style='padding-left:22px'>" + esc(pr.sp.name) +
          "<div style='font-size:11px;color:#7b8a99'>" + esc(pr.sp.title || "") + "</div></td>" +
        "<td>" + esc(pr.sp.location || "") + "</td>" +
        "<td>" + pr.d.toFixed(1) + " mi</td>" +
        "<td>" + mark(sc.rent, "fits", "over", "no ceiling") + "</td>" +
        "<td>" + mark(sc.beds, "fits", "no", "any") + "</td>" +
        "<td>" + mark(sc.type, "fits", "no", "any") + "</td>" +
        "<td>" + esc(o.rent_max ? "up to $" + Number(o.rent_max).toLocaleString() : "no ceiling") +
          ((pr.sp.options || []).length > 1 ? " <span style='color:#8593a4'>(best of " + pr.sp.options.length + ")</span>" : "") +
        "</td></tr>";
    });
  });

  html += "</tbody></table>";
  g.innerHTML =
    "<div style='padding:9px 12px;font-size:11.5px;color:#5b6b7d;background:#fff;border-bottom:1px solid #eef2f5'>" +
      "<b>" + rows + "</b> listing-and-renter pairs within 40 miles. " +
      "Green means those two agree on that point &mdash; it is a reading aid, not a decision." +
    "</div>" + html;

  var tr = g.querySelectorAll("tr[data-goto]");
  for (var i = 0; i < tr.length; i++) {
    tr[i].onclick = function(){
      sel = this.getAttribute("data-goto");
      gridOn = false;
      render();
    };
  }
}

function render(){
  var list = visible();
  el("map").style.display = gridOn ? "none" : "";
  el("grid").style.display = gridOn ? "block" : "none";
  var vb = el("bView");
  if (vb) vb.textContent = gridOn ? "Map view" : "Table view";
  if (gridOn) drawGrid(); else drawMap(list);
  drawQueue(list); drawDetail();
  el("cAll").textContent = DEMAND.length;
  /* The number that answers "how much demand can we act on right now".
     The old consent count could never answer it, because it only ever
     described the half nobody completed. */
  el("cCon").textContent = allRows().filter(workable).length;
  el("cShow").textContent = list.length;
  el("cLst").textContent = LISTINGS.filter(function(x){return x.live;}).length;
  /* ⭐ THE NUMBER THAT SHOULD DRIVE A DAY'S WORK. Everyone who came
     through the form, made an account, and stopped before building
     anything matchable. They are one conversation from being real demand. */
  /* ⭐ Joined and built NOTHING. A member with spots is not a gap, they
     are a success, and counting them here would hide the number that
     should drive a day's work. */
  el("cGap").textContent = LEADS.filter(function(x){return x.isMember && !x.spotCount;}).length;
  el("cCold").textContent = LEADS.filter(function(x){return !x.isMember;}).length;
}

function miles(a,b,c,d){var R=3958.8,p=Math.PI/180;
  var x=0.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2;
  return R*2*Math.asin(Math.sqrt(x));}

/* Match against WHERE THEY ARE LOOKING, not where they live.
   BD's form captures one location, labelled "Your Current Location", so
   matching on it meant an Ohio renter searching Utah was shown Ohio
   listings. searchGeo holds their zone-picker areas, geocoded. A listing is
   near them if it is near ANY of those areas.
   Leads without searchGeo predate this and fall back to their own
   coordinates, which is correct for anyone searching locally. */
function searchPoints(l){
  if (l.searchGeo && l.searchGeo.length) return l.searchGeo;
  if (l.lat && l.lon) return [{ lat: l.lat, lon: l.lon }];
  return [];
}

/* ---- lh-v9: SCORING A PAIR ------------------------------------------
   What actually lines up between one listing and one perfect spot, said
   out loud rather than left for the operator to work out by eye.

   ⚠️ IT SCORES AGAINST EACH OPTION SEPARATELY AND KEEPS THE BEST. That is
   the whole point of the options model: a renter open to a house at 2000
   OR a condo at 1000 is not "matched at 2000" - the condo has to clear the
   condo ceiling. Averaging or flattening them would reintroduce exactly
   the bug schema v4 exists to prevent.

   🔴 NOTHING HERE DECIDES ANYTHING. It is a reading aid for a person
   making the call. A pair with three green marks is worth looking at, not
   worth sending unseen. */
function bedsOverlap(listingBeds, wanted){
  if (!wanted || !wanted.length) return null;          // they did not say
  var n = String(listingBeds == null ? "" : listingBeds).replace(/[^0-9]/g, "");
  if (!n) return null;                                  // the listing does not say
  n = Number(n);
  var keys = [];
  if (n === 0) keys.push("studio");
  if (n === 1) keys.push("1");
  if (n === 2) keys.push("2");
  if (n === 3) keys.push("3");
  if (n >= 4) keys.push("4plus");
  for (var i = 0; i < keys.length; i++) if (wanted.indexOf(keys[i]) !== -1) return true;
  return false;
}

function typeOverlap(listingType, wanted){
  if (!wanted || !wanted.length) return null;
  var t = String(listingType || "").toLowerCase();
  if (!t) return null;
  for (var i = 0; i < wanted.length; i++) {
    if (t.indexOf(String(wanted[i]).toLowerCase()) !== -1) return true;
  }
  return false;
}

function scorePair(listing, spot){
  var best = null;
  (spot.options || []).forEach(function(o){
    var rent = null;
    if (o.rent_max && listing.rent) {
      rent = Number(listing.rent) <= Number(o.rent_max);
      /* A stretch is the renter's own stated flex, not ours to assume. */
      if (!rent && o.rent_stretch && Number(listing.rent) <= Number(o.rent_max) + Number(o.rent_stretch)) {
        rent = "stretch";
      }
    }
    var beds = bedsOverlap(listing.beds, o.beds);
    var type = typeOverlap(listing.propertyType || listing.type, o.unit_types);

    var hits = 0, known = 0;
    [rent, beds, type].forEach(function(v){
      if (v === null) return;
      known++;
      if (v === true || v === "stretch") hits++;
    });
    var cand = { option: o, rent: rent, beds: beds, type: type, hits: hits, known: known,
                 hard: rent === false };
    if (!best) { best = cand; return; }
    /* Prefer a pair that fails nothing, then one that matches more of
       what is known. */
    if (best.hard && !cand.hard) { best = cand; return; }
    if (!cand.hard && cand.hits > best.hits) best = cand;
  });
  return best;
}

function nearbyFor(l){
  var pts = searchPoints(l);
  if (!pts.length) return [];
  return LISTINGS
    .filter(function(x){ return x.lat && x.lon && x.live; })
    .map(function(x){
      var o={}; for(var q in x) o[q]=x[q];
      /* Distance to the CLOSEST of their areas. A renter watching two
         neighbourhoods should see listings near either, not near the point
         between them. */
      o.d = Math.min.apply(null, pts.map(function(p){ return miles(p.lat,p.lon,x.lat,x.lon); }));
      o.owner = PROVIDERS.filter(function(p){return String(p.id)===String(x.ownerId);})[0]||null;
      return o;
    })
    .filter(function(x){ return x.d < 40; })
    .sort(function(a,b){ return a.d-b.d; })
    .slice(0,8);
}

/* ---- SEARCHES -> LEAD-SHAPED ROWS -------------------------------------
   One renderer draws both, so a search has to answer the same questions a
   lead does: who, where, how much, when. Anything a search does not have
   is left null rather than faked, and drawDetail branches on kind. */

/* The pin. BD holds a zip index and nothing else, so the ONLY coordinates
   a search carries are the polygon the renter drew - which is exactly why
   ap-v9 stores the path even though nothing matches on it yet. Centroid of
   the drawn shape is where they want to live, which is the honest pin. A
   zone with zips but no path predates the path being stored and gets no
   pin rather than a guessed one. */
function zoneCentre(z){
  if (!z || !z.path || !z.path.length) return null;
  var la=0, ln=0, n=0;
  z.path.forEach(function(p){
    if (p && isFinite(p.lat) && isFinite(p.lng)) { la+=p.lat; ln+=p.lng; n++; }
  });
  return n ? { lat: la/n, lon: ln/n } : null;
}

function money(n){ return "$" + Number(n).toLocaleString(); }

function optionLine(o){
  var bits = [];
  if (o.unit_types && o.unit_types.length) bits.push(o.unit_types.join(", "));
  if (o.beds && o.beds.length) bits.push(o.beds.join("/") + " bed");
  if (o.baths_min) bits.push(o.baths_min + "+ bath");
  bits.push(o.rent_max ? "up to " + money(o.rent_max) : "no ceiling given");
  return bits.join(" · ");
}

function searchesToRows(members){
  var out = [];
  (members || []).forEach(function(m){
    var contact = m.contact || {};
    (m.searches || []).forEach(function(sr){
      var opts = sr.options || [];
      var centre = zoneCentre(sr.zone);
      var tops = opts.filter(function(o){ return o.rent_max; })
                     .map(function(o){ return o.rent_max; });
      out.push({
        kind: "search",
        /* Prefixed so it can never collide with a BD lead id. */
        id: "s:" + m.memberId + ":" + sr.id,
        memberId: m.memberId,
        name: contact.displayName || ("Member #" + m.memberId),
        email: contact.email || "",
        phone: contact.phone || "",
        currentZip: contact.zip || "",
        currentCity: [contact.city, contact.state].filter(Boolean).join(", "),
        verified: contact.verified || "",
        title: sr.name || "",
        enabled: sr.enabled !== false,
        submitted: sr.created || null,
        updated: sr.updated || null,
        zone: sr.zone || null,
        options: opts,
        household: m.household || null,
        criteria: sr.criteria || {},
        source: sr.source || "form",
        /* Fields the shared renderer reads. */
        location: sr.zone && sr.zone.name ? sr.zone.name : "no zone yet",
        budget: tops.length ? "up to " + money(Math.max.apply(null, tops)) : "",
        timing: "",
        lat: centre ? centre.lat : null,
        lon: centre ? centre.lon : null,
        searchGeo: centre ? [centre] : [],
        searchZips: (sr.zone && sr.zone.zips) || []
      });
    });
  });
  return out;
}

/* Legacy Get Matched requests, shaped to sit alongside a perfect spot so
   one renderer draws both. Everything a lead does not have is left null
   rather than faked. */
function leadsToRows(leads, idx){
  return (leads || []).map(function(l){
    var geo = (l.searchGeo && l.searchGeo.length) ? l.searchGeo[0] : null;
    var em = String(l.email || "").toLowerCase().trim();
    var hit = em ? idx[em] : null;
    return {
      kind: "lead",
      id: "l:" + l.id,
      leadId: l.id,
      name: l.name || ("Lead #" + l.id),
      email: l.email || "",
      phone: l.phone || "",
      isMember: !!hit,
      memberId: hit ? hit.memberId : "",
      spotCount: hit ? hit.spots : 0,
      runningCount: hit ? hit.running : 0,
      title: "",
      enabled: false,
      submitted: l.submitted || null,
      /* Where they are LOOKING if the notes carried it, otherwise where
         they are - which is the old behaviour and correct for anyone
         searching locally. */
      lat: geo ? geo.lat : (l.lat || null),
      lon: geo ? geo.lon : (l.lon || null),
      location: l.location || "no location given",
      budget: l.budget || "",
      timing: l.timing || "",
      searchZips: l.searchZips || [],
      searchAreas: l.searchAreas || [],
      propertyType: l.propertyType || "",
      household: null,
      householdText: l.household || "",
      pets: l.pets || "",
      petDetails: l.petDetails || "",
      cosigner: l.cosigner || "",
      description: l.description || "",
      obstacles: l.obstacles || "",
      /* Operator-only. Never rendered into a packet. */
      income: l.income || "",
      incomeSource: l.incomeSource || ""
    };
  });
}

function loadLeads(){
  return fetch(k(IDX))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok) { leadsErr = (d && d.error) || "could not read requests"; LEADS = []; return; }
      leadsErr = null;
      builtAt = d.builtAt || null;
      LEADS = leadsToRows(d.leads || [], memberIndex());
    })
    .catch(function(e){ leadsErr = String(e); LEADS = []; });
}

function loadDemand(){
  return fetch(k(DEM + "?demand=1"))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.members) {
        demandErr = (d && (d.error || d.message)) || "the endpoint returned no members array";
        DEMAND = []; memberCount = 0; return;
      }
      demandErr = null;
      memberCount = d.members.length;
      DEMAND = searchesToRows(d.members);
    })
    .catch(function(e){ demandErr = String(e); DEMAND = []; });
}

function loadProviders(){
  return fetch(k(PRV))
    .then(function(r){return r.json();})
    .then(function(d){ if(d&&d.ok){ PROVIDERS=d.providers||[]; LISTINGS=d.listings||[]; } })
    .catch(function(){ PROVIDERS=[]; LISTINGS=[]; });
}

function load(){
  var b = el("bRefresh");
  b.disabled = true; b.textContent = "Loading…";
  /* Demand FIRST, then leads - the member-email set is built from the
     demand index, so a parallel load would classify every lead as
     "no account". */
  loadDemand()
    .then(function(){ return Promise.all([loadLeads(), loadProviders()]); })
    .then(function(){
      render();
      /* An empty hub has two very different causes and the operator has
         to be able to tell them apart: nobody has built a request yet,
         or the read failed. Saying "no requests" when the endpoint 403'd
         is how a broken pipe goes unnoticed for a week. */
      if (!DEMAND.length && !LEADS.length) {
        el("queue").innerHTML = demandErr
          ? "<div class='empty'>Could not read perfect spots.<br><br>" + esc(demandErr) +
            "<br><br>Check the key on this page matches RDC_ADMIN_KEY in Netlify.</div>"
          : "<div class='empty'>No perfect spots yet.</div>";
      }
    })
    .catch(function(e){ el("queue").innerHTML="<div class='empty'>"+esc(String(e))+"</div>"; })
    .finally(function(){ b.disabled=false; b.textContent="Refresh"; });
}

["fKind","fConsent","fZone","fText"].forEach(function(id){
  el(id).addEventListener("input", function(){ sel=null; render(); });
});
el("bRefresh").onclick = function(){ load(); };
/* On screen as well as in the console. A version you have to open
   DevTools to read is a version nobody checks, and "is the new file
   actually live" has cost this project more time than any single bug.
   The deploy is not confirmed until the number in front of you changes. */
try { document.getElementById("hubVer").textContent = HUB_VERSION; } catch (e) {}
console.log("[Perfect spots] version:", HUB_VERSION);
load();
</script>
