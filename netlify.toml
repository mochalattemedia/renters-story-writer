# ============================================================
#  netlify.toml — v2
#  Site: renters-story-writer
#
#  v2: esbuild extended to the five Vertical Insure functions. Same
#      @netlify/blobs resolution failure send-listing-draft-email hit,
#      and these four have a second reason on top of it — they import a
#      RELATIVE module from outside the functions directory
#      (netlify/lib/vi-token.js), which the default bundler has to trace
#      and copy. esbuild inlines it instead, so there is nothing left to
#      resolve at runtime.
# ============================================================

[build]
  functions = "netlify/functions"
  publish = "."

# send-listing-draft-email could not resolve @netlify/blobs at runtime -
# "Cannot find module" on every invocation - while verify-log.js requires the
# identical module, in the identical way, from this same repo and works fine.
# The default bundler copies node_modules per function and was not copying it
# for this one. Rewriting the require three different ways changed nothing.
#
# esbuild bundles dependencies INTO the function file instead of copying
# folders beside it, so there is no resolution step left to fail.
#
# SCOPED TO ONE FUNCTION ON PURPOSE. There are 74 functions here and this is
# the only one with the problem; a site-wide bundler change is not something to
# make while chasing an unrelated bug. If this proves out, moving it to a plain
# [functions] block applies it to everything.
#
# TO REVERT: delete the block below. Nothing else depends on it.
[functions."send-listing-draft-email"]
  node_bundler = "esbuild"

# ------------------------------------------------------------
#  VERTICAL INSURE (v2)
#
#  All four of these import @netlify/blobs, three of them indirectly
#  through netlify/lib/vi-token.js. That relative import reaching OUTSIDE
#  the functions directory is the part the default bundler is least
#  reliable about, and the failure mode is the bad one: the function
#  deploys clean and throws "Cannot find module" on first invocation.
#
#  Still scoped rather than site-wide, same reasoning as above. If these
#  five run clean for a few weeks, that is the evidence for collapsing all
#  six blocks into one plain [functions] block.
#
#  TO REVERT: delete the blocks below.
# ------------------------------------------------------------
[functions."vi-webhook"]
  node_bundler = "esbuild"

[functions."vi-prefill"]
  node_bundler = "esbuild"

[functions."vi-invite-email"]
  node_bundler = "esbuild"

[functions."vi-offer-log"]
  node_bundler = "esbuild"

# vi-offer-js pulls in no packages at all - it only returns a string - but
# it is bundled the same way so the whole VI set behaves identically and
# nobody has to remember which one is the exception.
[functions."vi-offer-js"]
  node_bundler = "esbuild"
