[build]
  functions = "netlify/functions"
  publish = "."

# Live Members Map (Element T) — the one function that does everything: full member
# scan, pins, AND the "New this week" count (folded in at mmb-v28). Cron is the clock:
# each wake does one bounded batch, checkpoints, exits. Never self-invokes.
[functions."members-map-build"]
  schedule = "*/10 * * * *"
  
